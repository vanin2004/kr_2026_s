events {
    worker_connections 1024;
}

http {
    # Увеличенные лимиты для API с JSON (FastAPI + Keycloak webhooks)
    client_max_body_size 10M;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    server {
        listen 80;

        # ─── Keycloak IAM ────────────────────────────────────────────────
        location /auth/ {
            proxy_pass http://keycloak:8080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Увеличенный таймаут для Keycloak (долгие операции)
            proxy_read_timeout 120s;
        }

        # Статические ресурсы Keycloak (темы, иконки, CSS/JS)
        # Keycloak с KC_HTTP_RELATIVE_PATH=/auth генерирует ссылки
        # вида /resources/{theme}/... без префикса /auth, поэтому
        # проксируем их в Keycloak с добавлением /auth.
        location /resources/ {
            proxy_pass http://keycloak:8080/auth/resources/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Кеширование статики на 1 день
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # ─── Custom Logic API (FastAPI) ──────────────────────────────────
        # Все эндпоинты: CRUD, suggestions, internal (webhooks)
        location /api/custom/ {
            proxy_pass http://custom-api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS headers (для мобильного клиента)
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # ─── Health Check ────────────────────────────────────────────────
        location /health {
            proxy_pass http://custom-api:8000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
