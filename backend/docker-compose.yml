services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: tutorapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tutorapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v12.0.1
    environment:
      PGRST_DB_URI: postgres://postgres:password@db:5432/tutorapp
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: api_user
      PGRST_SERVER_PROXY_URI: http://localhost/api/data
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - postgrest
      - custom-api

  custom-api:
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/tutorapp
    depends_on:
      db:
        condition: service_healthy
