services:
  db:
    image: postgres:15
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - custom-api
      - keycloak

  custom-api:
    build:
      context: ./app
      dockerfile: Dockerfile
    volumes:
      - ./app/src:/app/src:ro
    env_file: .env
    environment:
      KEYCLOAK_URL: http://keycloak:8080/auth
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_URL: ${EXTERNAL_SERVERNAME:-http://localhost}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # --- НАСТРОЙКИ ВЕБХУКА ЧЕРЕЗ ENV ---
      WEBHOOK_HTTP_BASE_PATH: "http://custom-api:8000/api/custom/internal"
      WEBHOOK_EVENTS_TAKEN: "REGISTER,LOGIN,LOGOUT,UPDATE_PROFILE,DELETE_ACCOUNT"
      # Опционально:
      WEBHOOK_HTTP_RETRY_COUNT: "3"
      WEBHOOK_HTTP_RETRY_DELAY_MS: "1000"
      WEBHOOK_HTTP_CONNECT_TIMEOUT_MS: "5000"
      WEBHOOK_HTTP_READ_TIMEOUT_MS: "5000"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
      - ./keycloak-providers:/opt/keycloak/providers
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
