    patch:
      operationId: "updateTutorProfile"
      summary: "Обновить профиль репетитора"
      tags: ["tutor_profiles"]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorProfileUpdate"
      responses:
        "200":
          description: "Профиль обновлён"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorProfileRead"
        "404":
          description: "Профиль не найден"
    delete:
      operationId: "deleteTutorProfile"
      summary: "Удалить профиль репетитора"
      tags: ["tutor_profiles"]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Профиль удалён"
        "404":
          description: "Профиль не найден"

  # ────────────────────────────────────────────────────────────────
  # CRUD — Student Profiles (только по user_id, нет списка)
  # ────────────────────────────────────────────────────────────────
  /api/custom/student_profiles/{user_id}:
    get:
      operationId: "getStudentProfile"
      summary: "Получить профиль ученика"
      tags: ["student_profiles"]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Профиль ученика"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfileRead"
        "404":
          description: "Профиль не найден"
    post:
      operationId: "createStudentProfile"
      summary: "Создать профиль ученика"
      tags: ["student_profiles"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentProfileCreate"
      responses:
        "201":
          description: "Профиль создан"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfileRead"
    patch:
      operationId: "updateStudentProfile"
      summary: "Обновить профиль ученика"
      tags: ["student_profiles"]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentProfileUpdate"
      responses:
        "200":
          description: "Профиль обновлён"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfileRead"
        "404":
          description: "Профиль не найден"

  # ────────────────────────────────────────────────────────────────
  # CRUD — Tutor Tags
  # ────────────────────────────────────────────────────────────────
  /api/custom/tutor_tags:
    get:
      operationId: "listTutorTags"
      summary: "Список тегов репетиторов"
      tags: ["tutor_tags"]
      parameters:
        - name: tutor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: tag_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: "Список тегов репетиторов"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TutorTagRead"
    post:
      operationId: "createTutorTag"
      summary: "Добавить тег репетитору"
      tags: ["tutor_tags"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorTagCreate"
      responses:
        "201":
          description: "Тег добавлен"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorTagRead"
    delete:
      operationId: "deleteTutorTag"
      summary: "Удалить тег у репетитора"
      tags: ["tutor_tags"]
      parameters:
        - name: tutor_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: tag_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: "Тег удалён"
        "404":
          description: "Тег не найден"

  # ────────────────────────────────────────────────────────────────
