  # ────────────────────────────────────────────────────────────────
  /api/custom/student_preferred_tags:
    get:
      operationId: "listStudentPreferredTags"
      summary: "Список желаемых тегов ученика"
      tags: ["student_preferred_tags"]
      parameters:
        - name: student_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Список тегов"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentPreferredTagRead"
    post:
      operationId: "createStudentPreferredTag"
      summary: "Добавить желаемый тег ученику"
      tags: ["student_preferred_tags"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentPreferredTagCreate"
      responses:
