                  $ref: "#/components/schemas/ScheduleRead"
    post:
      operationId: "createSchedule"
      summary: "Добавить слот расписания"
      tags: ["schedules"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCreate"
      responses:
        "201":
          description: "Слот создан"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRead"

  /api/custom/schedules/{schedule_id}:
    get:
      operationId: "getSchedule"
      summary: "Получить слот расписания"
      tags: ["schedules"]
      parameters:
        - name: schedule_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "Слот расписания"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRead"
        "404":
          description: "Слот не найден"
    patch:
      operationId: "updateSchedule"
      summary: "Изменить слот расписания"
      tags: ["schedules"]
      parameters:
        - name: schedule_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdate"
      responses:
        "200":
          description: "Слот обновлён"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRead"
        "404":
          description: "Слот не найден"
    delete:
      operationId: "deleteSchedule"
      summary: "Удалить слот расписания"
      tags: ["schedules"]
      parameters:
        - name: schedule_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: "Слот удалён"
        "404":
          description: "Слот не найден"

  # ────────────────────────────────────────────────────────────────
  # CRUD — Lessons
  # ────────────────────────────────────────────────────────────────
  /api/custom/lessons:
    get:
      operationId: "listLessons"
      summary: "Список уроков"
      tags: ["lessons"]
      parameters:
        - name: student_id
          in: query
          schema:
            type: string
            format: uuid
        - name: tutor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: "Список уроков"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LessonRead"
    post:
      operationId: "createLesson"
      summary: "Забронировать урок"
      tags: ["lessons"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonCreate"
      responses:
        "201":
          description: "Урок создан"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonRead"

  /api/custom/lessons/{lesson_id}:
    get:
      operationId: "getLesson"
      summary: "Получить урок по ID"
      tags: ["lessons"]
      parameters:
        - name: lesson_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Данные урока"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonRead"
        "404":
          description: "Урок не найден"
    patch:
      operationId: "updateLesson"
      summary: "Обновить урок (подтвердить, отменить, добавить ссылку)"
      tags: ["lessons"]
      parameters:
        - name: lesson_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonUpdate"
      responses:
        "200":
          description: "Урок обновлён"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonRead"
        "404":
          description: "Урок не найден"
    delete:
      operationId: "deleteLesson"
      summary: "Удалить урок"
      tags: ["lessons"]
      parameters:
        - name: lesson_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Урок удалён"
        "404":
          description: "Урок не найден"

  # ────────────────────────────────────────────────────────────────
  # CRUD — Applications
  # ────────────────────────────────────────────────────────────────
  /api/custom/applications:
    get:
      operationId: "listApplications"
      summary: "Список заявок"
      tags: ["applications"]
      parameters:
        - name: student_id
          in: query
          schema:
            type: string
            format: uuid
        - name: tutor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: "Список заявок"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationRead"
    post:
      operationId: "createApplication"
      summary: "Подать заявку репетитору"
      tags: ["applications"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreate"
      responses:
        "201":
          description: "Заявка создана"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationRead"

  /api/custom/applications/{application_id}:
    get:
      operationId: "getApplication"
      summary: "Получить заявку по ID"
      tags: ["applications"]
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Данные заявки"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationRead"
        "404":
          description: "Заявка не найдена"
    patch:
      operationId: "updateApplication"
      summary: "Изменить статус заявки (принять / отклонить)"
      description: |
        Репетитор может принять (`accepted`) или отклонить (`rejected`) заявку.
        При принятии автоматически создаётся чат.
        При любом изменении статуса заполняется `responded_at`.
      tags: ["applications"]
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: "Заявка обновлена"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationRead"
        "404":
          description: "Заявка не найдена"
    delete:
      operationId: "deleteApplication"
      summary: "Удалить заявку"
      tags: ["applications"]
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Заявка удалена"
        "404":
          description: "Заявка не найдена"

  # ────────────────────────────────────────────────────────────────
  # CRUD — Chats
  # ────────────────────────────────────────────────────────────────
  /api/custom/chats:
    get:
      operationId: "listChats"
      summary: "Список чатов"
      tags: ["chats"]
      parameters:
        - name: application_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Список чатов"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatRead"

  # ────────────────────────────────────────────────────────────────
  # CRUD — Messages
  # ────────────────────────────────────────────────────────────────
  /api/custom/messages:
    get:
      operationId: "listMessages"
      summary: "История сообщений в чате"
      tags: ["messages"]
      parameters:
        - name: chat_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: "Список сообщений"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageRead"
    post:
      operationId: "createMessage"
      summary: "Отправить сообщение"
      tags: ["messages"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreate"
      responses:
        "201":
          description: "Сообщение отправлено"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageRead"

  /api/custom/messages/{message_id}:
    patch:
      operationId: "updateMessage"
      summary: "Обновить сообщение (например, отметить прочитанным)"
      tags: ["messages"]
      parameters:
        - name: message_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageUpdate"
      responses:
        "200":
          description: "Сообщение обновлено"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageRead"
        "404":
          description: "Сообщение не найдено"

  # ────────────────────────────────────────────────────────────────
  # CRUD — Test Library
  # ────────────────────────────────────────────────────────────────
  /api/custom/test_library:
    get:
      operationId: "listTestLibrary"
      summary: "Список тестов"
      tags: ["test_library"]
      parameters:
        - name: subject_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: "Список тестов"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestLibraryRead"
    post:
      operationId: "createTestLibrary"
      summary: "Добавить тест в библиотеку"
      tags: ["test_library"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestLibraryCreate"
      responses:
        "201":
          description: "Тест создан"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestLibraryRead"

  # ────────────────────────────────────────────────────────────────
  # CRUD — Student Results
  # ────────────────────────────────────────────────────────────────
  /api/custom/student_results:
    get:
      operationId: "listStudentResults"
      summary: "Список результатов тестирования"
      tags: ["student_results"]
      parameters:
        - name: student_id
          in: query
          schema:
            type: string
            format: uuid
        - name: tutor_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Список результатов"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentResultRead"
    post:
      operationId: "createStudentResult"
      summary: "Назначить тест ученику"
      tags: ["student_results"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentResultCreate"
      responses:
        "201":
          description: "Результат создан (тест назначен)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentResultRead"

  /api/custom/student_results/{result_id}:
    patch:
      operationId: "updateStudentResult"
      summary: "Обновить результат (сдать тест)"
      description: |
        Ученик заполняет `score` и `completed_at` при сдаче теста.
      tags: ["student_results"]
      parameters:
        - name: result_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentResultUpdate"
      responses:
        "200":
          description: "Результат обновлён"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentResultRead"
        "404":
          description: "Результат не найден"

  # ────────────────────────────────────────────────────────────────
  # CRUD — Reviews
  # ────────────────────────────────────────────────────────────────
  /api/custom/reviews:
    get:
      operationId: "listReviews"
      summary: "Список отзывов"
      tags: ["reviews"]
      parameters:
        - name: tutor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: student_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: "Список отзывов"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewRead"
    post:
      operationId: "createReview"
      summary: "Оставить отзыв на репетитора"
      tags: ["reviews"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCreate"
      responses:
        "201":
          description: "Отзыв создан"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRead"

  # ────────────────────────────────────────────────────────────────
  # CRUD — Device Tokens
  # ────────────────────────────────────────────────────────────────
  /api/custom/device_tokens:
    get:
      operationId: "listDeviceTokens"
      summary: "Список FCM-токенов устройства"
      tags: ["device_tokens"]
      parameters:
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Список токенов"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceTokenRead"
    post:
      operationId: "createDeviceToken"
      summary: "Зарегистрировать FCM-токен устройства"
      tags: ["device_tokens"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceTokenCreate"
      responses:
        "201":
          description: "Токен зарегистрирован"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTokenRead"

  /api/custom/device_tokens/{token_id}:
    delete:
      operationId: "deleteDeviceToken"
      summary: "Удалить FCM-токен устройства"
      tags: ["device_tokens"]
      parameters:
        - name: token_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: "Токен удалён"
        "404":
          description: "Токен не найден"

components:
  schemas:
    # ─── Subjects ─────────────────────────────────────────────────
    SubjectCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          example: "Математика"
    SubjectRead:
      allOf:
        - $ref: "#/components/schemas/SubjectCreate"
        - type: object
          properties:
            id:
              type: integer
    SubjectUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100

    # ─── Tags ─────────────────────────────────────────────────────
    TagCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          example: "#подготовка_к_ЕГЭ"
    TagRead:
      allOf:
        - $ref: "#/components/schemas/TagCreate"
        - type: object
          properties:
            id:
              type: integer
    TagUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100

    # ─── Users ────────────────────────────────────────────────────
    UserRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [tutor, student]
        created_at:
          type: string
          format: date-time

    # ─── Tutor Profile ────────────────────────────────────────────
    TutorProfileCreate:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
          example: "Иван Петров"
        photo_url:
          type: string
          format: uri
        education:
          type: string
          example: "МГУ, механико-математический факультет"
        subject_id:
          type: integer
        hourly_rate:
          type: integer
          description: "Цена в копейках (RUB)"
          example: 120000
        experience_years:
          type: integer
          default: 0
        is_verified:
          type: boolean
          default: false
        student_count:
          type: integer
          default: 0
    TutorProfileRead:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
        photo_url:
          type: string
          nullable: true
        education:
          type: string
          nullable: true
        subject_id:
          type: integer
          nullable: true
        hourly_rate:
          type: integer
          nullable: true
        experience_years:
          type: integer
        is_verified:
          type: boolean
        student_count:
          type: integer
        rating_efficiency:
          type: number
          format: decimal
          nullable: true
        rating_communication:
          type: number
          format: decimal
          nullable: true
        rating_expertise:
          type: number
          format: decimal
          nullable: true
        rating_responsiveness:
          type: number
          format: decimal
          nullable: true
        is_new_boost:
          type: boolean
    TutorProfileUpdate:
      type: object
      properties:
        full_name:
          type: string
        photo_url:
          type: string
        education:
          type: string
        subject_id:
          type: integer
        hourly_rate:
          type: integer
        experience_years:
          type: integer
        is_verified:
          type: boolean
        is_new_boost:
          type: boolean

    # ─── Student Profile ──────────────────────────────────────────
    StudentProfileCreate:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
        photo_url:
          type: string
        search_weights:
          type: object
          description: "Веса алгоритма подбора (k1..k5)"
          properties:
            k1_effectiveness:
              type: number
              default: 0.30
            k2_communication:
              type: number
              default: 0.15
            k3_expertise:
              type: number
              default: 0.20
            k4_responsiveness:
              type: number
              default: 0.15
            k5_tags:
              type: number
              default: 0.20
    StudentProfileRead:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
          nullable: true
        photo_url:
          type: string
          nullable: true
        search_weights:
          type: object
          nullable: true
    StudentProfileUpdate:
      type: object
      properties:
        full_name:
          type: string
        photo_url:
          type: string
        search_weights:
          type: object

    # ─── Tutor Tag ────────────────────────────────────────────────
    TutorTagCreate:
      type: object
      required: [tutor_id, tag_id]
      properties:
        tutor_id:
          type: string
          format: uuid
        tag_id:
          type: integer
    TutorTagRead:
      type: object
      properties:
        tutor_id:
          type: string
          format: uuid
        tag_id:
          type: integer

    # ─── Student Preferred Tag ────────────────────────────────────
    StudentPreferredTagCreate:
      type: object
      required: [student_id, tag_id]
      properties:
        student_id:
          type: string
          format: uuid
        tag_id:
          type: integer
        is_required:
          type: boolean
          default: false
          description: "true = жёсткий фильтр, false = мягкая оценка O5"
    StudentPreferredTagRead:
      type: object
      properties:
        student_id:
          type: string
          format: uuid
        tag_id:
          type: integer
        is_required:
          type: boolean

    # ─── Tutor Certification ──────────────────────────────────────
    TutorCertificationCreate:
      type: object
      required: [tutor_id, title, file_url]
      properties:
        tutor_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 255
          example: "Диплом МГУ"
        file_url:
          type: string
          format: uri
          maxLength: 500
    TutorCertificationRead:
      type: object
      properties:
        id:
          type: integer
        tutor_id:
          type: string
          format: uuid
        title:
          type: string
        file_url:
          type: string
        is_verified:
          type: boolean
        created_at:
          type: string
          format: date-time

    # ─── Schedule ─────────────────────────────────────────────────
    ScheduleCreate:
      type: object
      required: [tutor_id, start_time, end_time]
      properties:
        tutor_id:
          type: string
          format: uuid
        day_of_week:
          type: integer
          minimum: 1
          maximum: 7
          description: "1=Пн ... 7=Вс (NULL для разового слота)"
        specific_date:
          type: string
          format: date
          description: "Дата разового слота (NULL для регулярного)"
        start_time:
          type: string
          format: time
          example: "18:00:00"
        end_time:
          type: string
          format: time
          example: "20:00:00"
    ScheduleRead:
      type: object
      properties:
        id:
          type: integer
        tutor_id:
          type: string
          format: uuid
        day_of_week:
          type: integer
          nullable: true
        specific_date:
          type: string
          format: date
          nullable: true
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
    ScheduleUpdate:
      type: object
      properties:
        day_of_week:
          type: integer
          minimum: 1
          maximum: 7
          nullable: true
        specific_date:
          type: string
          format: date
          nullable: true
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time

    # ─── Lesson ───────────────────────────────────────────────────
    LessonCreate:
      type: object
      required: [student_id, tutor_id, start_datetime, end_datetime]
      properties:
        student_id:
          type: string
          format: uuid
        tutor_id:
          type: string
          format: uuid
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        meeting_link:
          type: string
          format: uri
    LessonRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        tutor_id:
          type: string
          format: uuid
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        status:
          type: string
          enum: [planned, completed, cancelled]
        meeting_link:
          type: string
          nullable: true
    LessonUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [planned, completed, cancelled]
        meeting_link:
          type: string

    # ─── Application ──────────────────────────────────────────────
    ApplicationCreate:
      type: object
      required: [student_id, tutor_id]
      properties:
        student_id:
          type: string
          format: uuid
        tutor_id:
          type: string
          format: uuid
    ApplicationRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        tutor_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, accepted, rejected]
        created_at:
          type: string
          format: date-time
        responded_at:
          type: string
          format: date-time
          nullable: true
    ApplicationUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, accepted, rejected]

    # ─── Chat ─────────────────────────────────────────────────────
    ChatRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        application_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    # ─── Message ──────────────────────────────────────────────────
    MessageCreate:
      type: object
      required: [chat_id, sender_id, text]
      properties:
        chat_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        text:
          type: string
    MessageRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        chat_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        text:
          type: string
        created_at:
          type: string
          format: date-time
        is_read:
          type: boolean
    MessageUpdate:
      type: object
      properties:
        is_read:
          type: boolean

    # ─── Test Library ─────────────────────────────────────────────
    TestLibraryCreate:
      type: object
      required: [subject_id, topic, questions_json]
      properties:
        subject_id:
          type: integer
        topic:
          type: string
          maxLength: 255
        questions_json:
          type: object
          description: "Вопросы теста в JSON-формате"
    TestLibraryRead:
      type: object
      properties:
        id:
          type: integer
        subject_id:
          type: integer
        topic:
          type: string
        questions_json:
          type: object

    # ─── Student Result ───────────────────────────────────────────
    StudentResultCreate:
      type: object
      required: [student_id, tutor_id, test_id, type]
      properties:
        student_id:
          type: string
          format: uuid
        tutor_id:
          type: string
          format: uuid
        test_id:
          type: integer
        type:
          type: string
          enum: [initial_test, control_test]
    StudentResultRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        tutor_id:
          type: string
          format: uuid
        test_id:
          type: integer
        type:
          type: string
        score:
          type: number
          nullable: true
        assigned_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    StudentResultUpdate:
      type: object
      properties:
        score:
          type: number
        completed_at:
          type: string
          format: date-time

    # ─── Review ───────────────────────────────────────────────────
    ReviewCreate:
      type: object
      required: [student_id, tutor_id, communication_score]
      properties:
        student_id:
          type: string
          format: uuid
        tutor_id:
          type: string
          format: uuid
        lesson_id:
          type: string
          format: uuid
        communication_score:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type: string
    ReviewRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        tutor_id:
          type: string
          format: uuid
        lesson_id:
          type: string
          format: uuid
          nullable: true
        communication_score:
          type: integer
        text:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    # ─── Device Token ─────────────────────────────────────────────
    DeviceTokenCreate:
      type: object
      required: [user_id, token, platform]
      properties:
        user_id:
          type: string
          format: uuid
        token:
          type: string
          maxLength: 500
          description: "FCM-токен устройства"
        platform:
          type: string
          enum: [android, ios]
    DeviceTokenRead:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: string
          format: uuid
        token:
          type: string
        platform:
          type: string
        updated_at:
          type: string
          format: date-time

    # ─── Suggestions ──────────────────────────────────────────────
    ScheduleSlot:
      type: object
      required: [day_of_week, start_time, end_time]
      properties:
        day_of_week:
          type: integer
          minimum: 1
          maximum: 7
          description: "1=Пн, 7=Вс"
        start_time:
          type: string
          format: time
          example: "18:00:00"
        end_time:
          type: string
          format: time
          example: "20:00:00"
    SuggestionWeights:
      type: object
      properties:
        k1_effectiveness:
          type: number
          default: 0.30
          minimum: 0.0
          maximum: 1.0
          description: "Вес эффективности (O1)"
        k2_communication:
          type: number
          default: 0.15
          minimum: 0.0
          maximum: 1.0
          description: "Вес коммуникации (O2)"
        k3_expertise:
          type: number
          default: 0.20
          minimum: 0.0
          maximum: 1.0
          description: "Вес экспертизы (O3)"
        k4_responsiveness:
          type: number
          default: 0.15
          minimum: 0.0
          maximum: 1.0
          description: "Вес отзывчивости (O4)"
        k5_tags:
          type: number
          default: 0.20
          minimum: 0.0
          maximum: 1.0
          description: "Вес совпадения тегов (O5)"
    SuggestionRequest:
      type: object
      required: [subject_id]
      properties:
        subject_id:
          type: integer
          description: "ID предмета"
        max_price:
          type: integer
          description: "Максимальная цена (в копейках)"
        min_experience:
          type: integer
          default: 0
          minimum: 0
          description: "Минимальный стаж (лет)"
        verified_only:
          type: boolean
          default: false
          description: "Только верифицированные репетиторы"
        schedule_slots:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleSlot"
          description: "Совместимость по расписанию"
        required_tag_ids:
          type: array
          items:
            type: integer
          description: "Обязательные теги (используются в O5)"
        weights:
          $ref: "#/components/schemas/SuggestionWeights"
    ScoreBreakdown:
      type: object
      properties:
        o1:
          type: number
          description: "Effectiveness (эффективность)"
        o2:
          type: number
          description: "Communication (коммуникация)"
        o3:
          type: number
          description: "Expertise (экспертиза)"
        o4:
          type: number
          description: "Responsiveness (отзывчивость)"
        o5:
          type: number
          description: "Tag Match (совпадение тегов)"
    SuggestionResponse:
      type: object
      properties:
        tutor_id:
          type: string
          format: uuid
        full_name:
          type: string
          nullable: true
        score:
          type: number
          description: "Итоговая оценка [0..1]"
        score_breakdown:
          $ref: "#/components/schemas/ScoreBreakdown"
        hourly_rate:
          type: integer
          nullable: true
          description: "Цена в копейках"
        is_new:
          type: boolean
          description: "Cold-start boost активен"

    # ─── Keycloak Webhook ─────────────────────────────────────────
    KeycloakUserCreated:
      type: object
      required: [userId, email, realmRole]
      properties:
        userId:
          type: string
          description: "UUID пользователя из Keycloak"
        email:
          type: string
          format: email
        realmRole:
          type: string
          enum: [tutor, student]
          description: "Роль пользователя"

