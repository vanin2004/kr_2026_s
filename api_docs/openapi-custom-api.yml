openapi: "3.1.0"
info:
  title: "TutorApp — Custom Logic API (FastAPI)"
  version: "1.0.0"
  description: |
    Сервис кастомной бизнес-логики на FastAPI.

    Функции:
    - **CRUD-эндпоинты** для всех таблиц
    - **Алгоритм подбора** репетиторов (`/suggestions`)
    - **Внутренние вебхуки** (`/internal/*`) — только для Docker-сети
    - **Health Check** (`/health`)
    - **Push-уведомления** (фоновый воркер через PostgreSQL LISTEN/NOTIFY)

    Через Nginx проксируется по префиксу `/api/custom/`.
    Эндпоинты `/internal/*` не доступны через Nginx наружу.

  contact:
    name: "TutorApp Team"

servers:
  - url: "http://custom-api:8000"
    description: "Внутренняя Docker-сеть (прямой доступ)"
  - url: "http://localhost:80/api/custom"
    description: "Через Nginx Gateway"

paths:
  # ────────────────────────────────────────────────────────────────
  # Health Check
  # ────────────────────────────────────────────────────────────────
  /health:
    get:
      operationId: "healthCheck"
      summary: "Проверка работоспособности сервиса"
      tags: ["Health"]
      responses:
        "200":
          description: "Сервис работает"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  # ────────────────────────────────────────────────────────────────
  # Suggestions (Подбор репетиторов)
  # ────────────────────────────────────────────────────────────────
  /api/custom/suggestions:
    post:
      operationId: "getSuggestions"
      summary: "Подобрать репетиторов по параметрам"
      description: |
        Запускает двухэтапный алгоритм подбора:

        1. **Hard Filters** (SQL): предмет, макс. цена, минимальный опыт,
           только верифицированные, слоты расписания, обязательные теги.
        2. **Soft Scoring** (Python): расчёт итогового Score = Σ(Oi × ki)
           по пяти метрикам (O1..O5) с весами ученика (k1..k5).

        Результат сортируется по score (убывание).
      tags: ["suggestions"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestionRequest"
      responses:
        "200":
          description: "Отсортированный список репетиторов с оценками"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SuggestionResponse"
        "500":
          description: "Ошибка сервера"

  # ────────────────────────────────────────────────────────────────
  # Internal Webhook — User Created
  # ────────────────────────────────────────────────────────────────
  /api/custom/internal/user-created:
    post:
      operationId: "internalUserCreated"
      summary: "Вебхук регистрации пользователя (только internal)"
      description: |
        Вызывается Keycloak Event Listener при событии `REGISTER`.
        Создаёт запись в `users` + пустой профиль (`tutor_profiles` или `student_profiles`).
        **Недоступен через Nginx** — только внутренняя Docker-сеть.
      tags: ["internal"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeycloakUserCreated"
      responses:
        "201":
          description: "Пользователь создан"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [created, already_exists]
        "400":
          description: "Некорректная роль"
        "422":
          description: "Некорректный UUID"

  # ────────────────────────────────────────────────────────────────
  # CRUD — Subjects
  # ────────────────────────────────────────────────────────────────
  /api/custom/subjects:
    get:
      operationId: "listSubjects"
      summary: "Список предметов"
      tags: ["subjects"]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 1000
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: "Список предметов"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectRead"
    post:
      operationId: "createSubject"
      summary: "Создать предмет"
      tags: ["subjects"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectCreate"
      responses:
        "201":
          description: "Предмет создан"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectRead"

  /api/custom/subjects/{item_id}:
    get:
      operationId: "getSubject"
      summary: "Получить предмет по ID"
      tags: ["subjects"]
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "Данные предмета"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectRead"
        "404":
          description: "Предмет не найден"
    patch:
      operationId: "updateSubject"
      summary: "Обновить предмет"
      tags: ["subjects"]
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectUpdate"
      responses:
        "200":
          description: "Предмет обновлён"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectRead"
        "404":
          description: "Предмет не найден"
    delete:
      operationId: "deleteSubject"
      summary: "Удалить предмет"
      tags: ["subjects"]
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: "Предмет удалён"
        "404":
          description: "Предмет не найден"

  # ────────────────────────────────────────────────────────────────
  # CRUD — Tags
  # ────────────────────────────────────────────────────────────────
  /api/custom/tags:
    get:
      operationId: "listTags"
      summary: "Список тегов"
      tags: ["tags"]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 1000
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: "Список тегов"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagRead"
    post:
      operationId: "createTag"
      summary: "Создать тег"
      tags: ["tags"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagCreate"
      responses:
        "201":
          description: "Тег создан"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagRead"

  /api/custom/tags/{item_id}:
    get:
      operationId: "getTag"
      summary: "Получить тег по ID"
      tags: ["tags"]
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "Данные тега"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagRead"
        "404":
          description: "Тег не найден"
    patch:
      operationId: "updateTag"
      summary: "Обновить тег"
      tags: ["tags"]
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagUpdate"
      responses:
        "200":
          description: "Тег обновлён"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagRead"
        "404":
          description: "Тег не найден"
    delete:
      operationId: "deleteTag"
      summary: "Удалить тег"
      tags: ["tags"]
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: "Тег удалён"
        "404":
          description: "Тег не найден"

  # ────────────────────────────────────────────────────────────────
  # CRUD — Users
  # ────────────────────────────────────────────────────────────────
  /api/custom/users:
    get:
      operationId: "listUsers"
      summary: "Список пользователей"
      tags: ["users"]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: "Список пользователей"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserRead"

  /api/custom/users/{user_id}:
    get:
      operationId: "getUser"
      summary: "Получить пользователя по UUID"
      tags: ["users"]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Данные пользователя"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRead"
        "404":
          description: "Пользователь не найден"
    delete:
      operationId: "deleteUser"
      summary: "Удалить пользователя"
      tags: ["users"]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Пользователь удалён"
        "404":
          description: "Пользователь не найден"

  # ────────────────────────────────────────────────────────────────
  # CRUD — Tutor Profiles
  # ────────────────────────────────────────────────────────────────
  /api/custom/tutor_profiles:
    get:
      operationId: "listTutorProfiles"
      summary: "Список профилей репетиторов"
      tags: ["tutor_profiles"]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: subject_id
          in: query
          schema:
            type: integer
          description: "Фильтр по предмету"
        - name: hourly_rate_lte
          in: query
          schema:
            type: integer
          description: "Фильтр: макс. цена (hourly_rate <= значение)"
      responses:
        "200":
          description: "Список профилей"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TutorProfileRead"
    post:
      operationId: "createTutorProfile"
      summary: "Создать профиль репетитора"
      tags: ["tutor_profiles"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorProfileCreate"
      responses:
        "201":
          description: "Профиль создан"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorProfileRead"

  /api/custom/tutor_profiles/{user_id}:
    get:
      operationId: "getTutorProfile"
      summary: "Получить профиль репетитора"
      tags: ["tutor_profiles"]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Профиль репетитора"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorProfileRead"
        "404":
