        "404":
          description: "Тег не найден"

  # ────────────────────────────────────────────────────────────────
  # CRUD — Tutor Certifications
  # ────────────────────────────────────────────────────────────────
  /api/custom/tutor_certifications:
    get:
      operationId: "listTutorCertifications"
      summary: "Список сертификатов репетитора"
      tags: ["tutor_certifications"]
      parameters:
