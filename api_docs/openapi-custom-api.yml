          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Список сертификатов"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TutorCertificationRead"
    post:
      operationId: "createTutorCertification"
      summary: "Добавить сертификат репетитору"
      tags: ["tutor_certifications"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorCertificationCreate"
      responses:
        "201":
          description: "Сертификат добавлен"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorCertificationRead"

  # ────────────────────────────────────────────────────────────────
  # CRUD — Schedules
  # ────────────────────────────────────────────────────────────────
  /api/custom/schedules:
    get:
      operationId: "listSchedules"
      summary: "Список слотов расписания"
      tags: ["schedules"]
      parameters:
